{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — UyIjara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Inter', sans-serif;
        background: #fafaf8;
        color: #1e1b4b;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .wrap { max-width: 520px; text-align: center; }
    .code { font-size: 8rem; font-weight: 900; color: #ef4444; line-height: 1; letter-spacing: -4px; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #6b5fb8; margin-bottom: 24px; line-height: 1.6; }
    a { display: inline-block; padding: 12px 22px; background: #7c3aed; color: white; border-radius: 12px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">500</div>
        <h1>{% trans "Server xatosi" %}</h1>
        <p>{% trans "Kechirasiz, kutilmagan xato yuz berdi. Texnik jamoa xabardor qilindi." %}</p>
        <a href="/">{% trans "Bosh sahifaga" %}</a>
    </div>
</body>
</html>
